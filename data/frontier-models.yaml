# Curated open-weight models the snapshot regen always fetches by repo id,
# on top of whichllm's discovery (scripts/benchmark_sources/frontier.py).
#
# whichllm only lists `text-generation` repos plus its own frontier list, so
# vision-tagged chat models (Qwen3.5+, Gemma 4, Flash-Next) and recent
# releases fall through. Each id below is read straight from HuggingFace, and
# its GGUF quants come from the real files in trusted publisher repos.
#
# Fields:
#   id      source repo (required).
#   active  active params per token in billions, for MoE models whose repo
#           name has no `-A<N>B` suffix. Taken from the model card.
#   gguf    GGUF repos to read, in priority order. Default: probe
#           unsloth, bartowski, ggml-org, lmstudio-community, mradermacher
#           and the model's own org for `<name>-GGUF`.
#   aa      the model's name on the Artificial Analysis leaderboard, without
#           the effort / reasoning suffix. Its Intelligence Index score
#           replaces whichllm's (scripts/benchmark_sources/aa_index.py).
#           No AA row as of 2026-10-30: SmolLM3, LFM3, LFM2.5-24B, Ornith,
#           Clef, Mellum, Hy-Memory, Flint, Laguna, KAT-Coder-V2.5-Dev.
#
# Grouped by the smallest host that runs them at Q4 or lower. MoE models also
# run on smaller GPUs with experts in system RAM.
#
# Checked against HF downloads and recent releases on 2026-10-29. Left out:
# models over ~420B total (no quant fits 128 GB: Kimi-K3, GLM-5.x, DeepSeek
# V4-Pro / V4.1-Flash, MiniMax-M3 / M3.1, Muse Spark Open, Ling 3.1 Flash,
# Qwen3.5-397B) and models with no GGUF from a trusted publisher.

